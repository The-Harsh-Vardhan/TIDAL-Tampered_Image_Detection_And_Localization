name: Secret Scanning
on:
  push: {branches: [main, production]}
  pull_request: {branches: [main, production]}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Collect changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed_files.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed_files.txt
          fi

          if [[ ! -s changed_files.txt ]]; then
            echo "No changed files to scan." > changed_files.txt
          fi

      - name: Run secret scanner on changed files
        shell: bash
        run: |
          mapfile -t files < changed_files.txt
          if [[ "${files[0]}" == "No changed files to scan." ]]; then
            echo "No changed files to scan."
            exit 0
          fi

          python scripts/security/scan_secrets.py --root . --files "${files[@]}"
